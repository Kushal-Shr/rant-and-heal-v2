name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Build validation needs syntactically present public Firebase config.
      # These are inert CI-only values; deployments must provide real values.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-rant-and-heal-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-rant-and-heal-ci.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci-build"

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set NEXT_PUBLIC_FIREBASE_API_KEY in .env.local}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN in .env.local}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set NEXT_PUBLIC_FIREBASE_PROJECT_ID in .env.local}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:?Set NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET in .env.local}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?Set NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID in .env.local}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?Set NEXT_PUBLIC_FIREBASE_APP_ID in .env.local}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
        NEXT_PUBLIC_CRISIS_CONTACT_NAME: ${NEXT_PUBLIC_CRISIS_CONTACT_NAME:-}
        NEXT_PUBLIC_CRISIS_CONTACT_PHONE: ${NEXT_PUBLIC_CRISIS_CONTACT_PHONE:-}
        ENABLE_MOMO_VOICE: ${ENABLE_MOMO_VOICE:-false}
    env_file:
      - .env.local
    environment:
      ENABLE_MOMO_VOICE: ${ENABLE_MOMO_VOICE:-false}
    init: true
    ports:
      - "3000:3000"
    restart: unless-stopped
